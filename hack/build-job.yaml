# Parameterized BuildKit build Job.
#
# Rendered and applied by the release-to-image dispatcher when this repo is
# released, and by `hack/build-cluster.sh` when `make build` runs with a
# BUILD_TARGET other than `local`. The default local arm does not use it:
# `make build` with no BUILD_TARGET still builds with plain `docker build`.
#
# This file lives outside k8s/ on purpose: everything under k8s/ is deploy
# state reached through `make apply`, so a template kept there would be adopted
# as such.
#
# Template tokens:
#   __JOB_NAME__           Job name, derived from __TAG__ and sanitized for DNS
#   __REPO_URL__           git URL to clone
#   __REF__                git ref (branch, tag or commit) to build
#   __TAG__                image tag to push
#   __DOCKERFILE__         Dockerfile path inside the repository, always relative
#                          to the repository ROOT even when __CONTEXT_PATH__ is a
#                          subdirectory (so a nested Dockerfile is "blog/Dockerfile")
#   __CONTEXT_PATH__       BuildKit build-context directory: /src, or /src/<SUBDIR>
#   __IMAGE__              target image repository, without tag
#   __PUSH__               "true" to push the built image
#   __PUSH_SECRET__        name of the dockerconfigjson secret to mount
#   __DEADLINE_SECONDS__   Job deadline in seconds
#   __SOURCE_DATE_EPOCH__  commit timestamp, decimal seconds
#
# Prerequisite (not created by this manifest): a kubernetes.io/dockerconfigjson
# secret in the build namespace, named by __PUSH_SECRET__, holding a credential
# that may push to the target registry.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: build
  labels:
    app.kubernetes.io/name: image-build
    app.kubernetes.io/component: build
    app.kubernetes.io/version: "__TAG__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __DEADLINE_SECONDS__
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-build
        app.kubernetes.io/component: build
        app.kubernetes.io/version: "__TAG__"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # The mint image lives on a private registry, so the kubelet needs a
      # credential for it. Without this the pod sits in ImagePullBackOff with
      # `no basic auth credentials` — the same failure an expired clone token
      # produces, which is what makes it easy to misread as a broken image.
      imagePullSecrets:
        - name: buildkit-push-nuke
      initContainers:
        # Mints a GitHub App installation token for THIS pod. A render-time mint
        # (hack/mint-git-credential.sh) writes one token into a shared Secret and
        # that token dies 60 minutes later, so every build after the hour fails
        # at the clone with `could not read Username`. Minting here makes the
        # credential's lifetime the pod's, not the render's.
        - name: mint-token
          image: __MINT_IMAGE__
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # The credential is OPTIONAL — the volume is `optional: true`, so a
              # cluster without the Secret mounts an empty directory rather than
              # failing. Gate on the files, or `set -eu` turns an absent Secret
              # into an init failure that breaks every public-repo build.
              if [ ! -f /git-credential/APP_ID ] \
                || [ ! -f /git-credential/INSTALLATION_ID ] \
                || [ ! -f /git-credential/PEM_KEY ]; then
                echo "mint-token: no git-credential Secret mounted; building unauthenticated (public repos only)"
                exit 0
              fi
              # The App identity is read from the mounted Secret rather than
              # templated in: no numeric IDs reach the rendered manifest, and one
              # template serves every repo without a per-repo ID table.
              /main \
                -app-id="$(cat /git-credential/APP_ID)" \
                -installation-id="$(cat /git-credential/INSTALLATION_ID)" \
                -pem-key-file=/git-credential/PEM_KEY \
                > /token/token
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: git-credential
              mountPath: /git-credential
              readOnly: true
            - name: token
              mountPath: /token
        - name: clone
          image: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # A private repository needs a read credential. The token secret is
              # optional: when it is absent the clone runs anonymously, which is what
              # every public repo in this fleet relies on.
              #
              # The token travels in an Authorization header, never in the URL. A URL
              # credential would be written into .git/config and recorded verbatim in
              # .git/FETCH_HEAD, and /src is the same volume the build container reads —
              # a Dockerfile doing `COPY . /workspace` would copy the token into the
              # build. The header keeps every on-disk reference clean, and FETCH_HEAD is
              # removed anyway as a belt-and-braces measure.
              git init -q /src
              git -C /src remote add origin "$1"
              # Written by the mint-token init container, not mounted: the token is
              # minted per pod and never persisted in a Secret.
              token_file=/token/token
              # The secret is projected with an explicit `items:` list, so a secret
              # that exists without the expected key fails the mount loudly. This
              # branch covers the remaining case: the key present but blank.
              if [ -e "${token_file}" ] && [ ! -s "${token_file}" ]; then
                echo "ERROR: ${token_file} exists but is empty — the git-clone secret" >&2
                echo "       has a blank token value. Fix the secret or delete it." >&2
                exit 1
              fi
              if [ -s "${token_file}" ]; then
                # Never offer a credential over a plaintext hop.
                case "$1" in
                  https://*) ;;
                  *) echo "ERROR: refusing to send a clone credential to a non-https" >&2
                     echo "       REPO_URL ($1). Use https:// or remove the token." >&2
                     exit 1 ;;
                esac
                # The header goes into a throwaway git config rather than `git -c`,
                # which would put the credential on argv where /proc/<pid>/cmdline
                # exposes it to every process in the pod.
                auth="$(printf 'x-access-token:%s' "$(cat "${token_file}")" | base64 | tr -d '\n')"
                cfg="$(umask 077; mktemp)"
                # EXIT covers the `set -e` abort path a failed fetch takes, which
                # would otherwise leave the credential on disk for the pod's TTL.
                trap 'rm -f "${cfg}"' EXIT
                # Scoped to this origin rather than the global [http] section, so a
                # redirect to another host is never offered the header.
                printf '[http "%s"]\n\textraHeader = Authorization: Basic %s\n' "$1" "${auth}" > "${cfg}"
                GIT_CONFIG_GLOBAL="${cfg}" git -C /src fetch -q --depth=1 --tags -- origin "$2"
                rm -f "${cfg}"
              else
                git -C /src fetch -q --depth=1 --tags -- origin "$2"
              fi
              git -C /src checkout -q --detach FETCH_HEAD
              rm -f /src/.git/FETCH_HEAD
              git -C /src log -1 --format=%ct > /meta/source-date-epoch
              git -C /src log -1 --format=%cI > /meta/source-date-iso
              git -C /src rev-parse --short HEAD > /meta/git-commit
              git -C /src describe --tags --always --dirty > /meta/git-version
              echo "cloned $1 at $2: $(git -C /src rev-parse HEAD) epoch=$(cat /meta/source-date-epoch) version=$(cat /meta/git-version)"
            - clone
            - "__REPO_URL__"
            - "__REF__"
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /src
          # Memory requests are deliberately small: the build node runs at ~98%
          # of its request capacity, and a pod asking for a GiB of scheduling
          # headroom to do a few hundred MiB of work never schedules there.
          # The limits are the real constraint; a request is only a hint.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Hardened like any other container: the clone needs to write /src and
          # /meta and nothing else, so it keeps no capability and cannot escalate.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
            # Only the minted token, never the App PEM: the clone has no reason
            # to read a key that can mint credentials for every repo the App sees.
            - name: token
              mountPath: /token
              readOnly: true
      containers:
        - name: build
          image: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cloned_epoch="$(cat /meta/source-date-epoch)"
              if [ "${cloned_epoch}" != "__SOURCE_DATE_EPOCH__" ]; then
                echo "REF __REF__ is commit epoch ${cloned_epoch} in the cluster but __SOURCE_DATE_EPOCH__ in the local repository; run git fetch and retry" >&2
                exit 1
              fi
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=__CONTEXT_PATH__ \
                --local dockerfile=/src \
                --opt filename=__DOCKERFILE__ \
                --opt platform=linux/amd64 \
                --opt build-arg:SOURCE_DATE_EPOCH=__SOURCE_DATE_EPOCH__ \
                --opt build-arg:BUILD_GIT_VERSION="$(cat /meta/git-version)" \
                --opt build-arg:BUILD_GIT_COMMIT="$(cat /meta/git-commit)" \
                --opt build-arg:BUILD_DATE="$(cat /meta/source-date-iso)" \
                --opt build-arg:DOCKER_REGISTRY=docker.io \
                --metadata-file /meta/metadata.json \
                --output type=image,name=__IMAGE__:__TAG__,push=__PUSH__,rewrite-timestamp=true
              cat /meta/metadata.json
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox"
            - name: DOCKER_CONFIG
              value: "/docker-config"
          # Unconfined is deliberate and is NOT an oversight left over from the
          # init containers above: rootless buildkitd with
          # --oci-worker-no-process-sandbox needs both profiles relaxed to run
          # nested containers. Tightening them breaks every build.
          #
          # ⚠️ DO NOT add `allowPrivilegeEscalation: false` or
          # `capabilities.drop: ["ALL"]` here, however free they look. Both break
          # every build. buildctl-daemonless.sh runs as uid 1000 and starts
          # buildkitd through `rootlesskit`, which installs its uid/gid map with
          # the setuid helpers newuidmap/newgidmap. no_new_privs neutralises the
          # setuid bit and an empty bounding set strips the CAP_SETUID they need,
          # so buildkitd never starts and the build dies at the first buildctl
          # call. Measured on nukedev 2026-11-03:
          #   [rootlesskit:parent] error: failed to setup UID/GID map:
          #   newuidmap 40 [0 1000 1 1 100000 65536] failed: :
          #   fork/exec /usr/bin/newuidmap: operation not permitted
          # The boundary here is the unprivileged uid plus the trust model
          # documented on the docker-config mount below, not dropped capabilities.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
            # Container-internal path, not a host path: rootless buildkitd writes its
            # state to $HOME/.local/share/buildkit inside the image, and needs it
            # writable. Not a self-containment violation.
            - name: buildkitd
              mountPath: /home/user/.local/share/buildkit
            # ⚠️ TRUST BOUNDARY. This is the registry push credential, and it sits in
            # the same container that executes the repo's Dockerfile steps: with
            # --oci-worker-no-process-sandbox those steps run in buildkitd's own
            # namespace, so a Dockerfile can read this file. That is acceptable only
            # because REF is chosen by the operator and these repositories are the
            # operator's own. Two consequences follow, and both are requirements:
            #   1. The secret must hold a registry token scoped to pushing these
            #      images — never an account-wide credential.
            #   2. Do not point REF at an untrusted fork or contributor branch.
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
      volumes:
        # The App identity the mint-token container reads. Optional on purpose: a
        # cluster without it still builds every public repo, and a private one
        # fails loudly at the mint instead of silently running unauthenticated.
        #
        # This replaces a `git-clone` Secret holding one pre-minted token. That
        # design dies on a clock: an installation token lives 60 minutes, so a
        # repo whose builds are days apart clones anonymously and fails with
        # `could not read Username for 'https://github.com'` — measured
        # 2026-11-13 on both sun and nukedev.
        - name: git-credential
          secret:
            secretName: __GIT_SECRET__
            optional: true
            items:
              - key: APP_ID
                path: APP_ID
              - key: INSTALLATION_ID
                path: INSTALLATION_ID
              - key: PEM_KEY
                path: PEM_KEY
        # Holds the minted installation token. The build container mounts
        # neither this nor the App secret.
        - name: token
          emptyDir: {}
        - name: src
          emptyDir: {}
        - name: meta
          emptyDir: {}
        - name: buildkitd
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: __PUSH_SECRET__
            items:
              - key: .dockerconfigjson
                path: config.json

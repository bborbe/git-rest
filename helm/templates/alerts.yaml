{{- if .Values.alerts.enabled }}
{{- range $vault := .Values.vaults }}
{{- $name := include "git-rest.vaultName" (dict "name" $vault.name) }}
{{- $camel := $vault.name | title }}
---
apiVersion: monitoring.benjamin-borbe.de/v1
kind: Alert
metadata:
  name: '{{ $name }}-pull-failing-warning'
  namespace: {{ $.Release.Namespace }}
spec:
  annotations:
    summary: {{ $name }} git pull failing
    description: 'git-rest in {{ $name }} has failing pulls for >5min — check logs for fetch/auth/network errors or divergence'
  expression: |-
    rate(git_rest_git_operation_errors_total{app="{{ $name }}",operation=~"pull|fetch|push|rebase"}[5m]) > 0
  for: 5m
  labels:
    severity: warning
    namespace: {{ $.Release.Namespace }}
  name: VaultObsidian{{ $camel }}PullFailing
---
apiVersion: monitoring.benjamin-borbe.de/v1
kind: Alert
metadata:
  name: '{{ $name }}-rebase-conflict-critical'
  namespace: {{ $.Release.Namespace }}
spec:
  annotations:
    summary: {{ $name }} rebase content conflict
    description: 'git-rest in {{ $name }} hit a rebase content conflict — requires human resolution. Exec into pod, inspect the pod log for the conflict path, resolve manually or reset PVC.'
  expression: |-
    increase(git_rest_git_operation_errors_total{app="{{ $name }}",operation="rebase",conflict="true"}[10m]) > 0
  for: 1m
  labels:
    severity: critical
    namespace: {{ $.Release.Namespace }}
  name: VaultObsidian{{ $camel }}RebaseConflict
---
apiVersion: monitoring.benjamin-borbe.de/v1
kind: Alert
metadata:
  name: '{{ $name }}-puller-silent-critical'
  namespace: {{ $.Release.Namespace }}
spec:
  annotations:
    summary: {{ $name }} puller stopped
    description: 'git-rest puller in {{ $name }} has not recorded a pull operation in >2min (PullInterval=30s, expected ≥4 ticks). Possible deadlock, panic, or scheduling issue.'
  expression: |-
    rate(git_rest_git_operation_duration_seconds_count{app="{{ $name }}",operation="pull"}[5m]) == 0
  for: 2m
  labels:
    severity: critical
    namespace: {{ $.Release.Namespace }}
  name: VaultObsidian{{ $camel }}PullerSilent
---
apiVersion: monitoring.benjamin-borbe.de/v1
kind: Alert
metadata:
  name: '{{ $name }}-quarantine-backlog-warning'
  namespace: {{ $.Release.Namespace }}
spec:
  annotations:
    summary: {{ $name }} has quarantined files waiting
    description: 'git-rest in {{ $name }} has files sitting in _conflicts/ for more than 1h — inspect _conflicts/ in the pod, repair or deliberately discard the file, then remove it so the backlog is counted down'
  expression: |-
    git_rest_quarantined_backlog{app="{{ $name }}"} > 0
  for: 1h
  labels:
    severity: warning
    namespace: {{ $.Release.Namespace }}
  name: VaultObsidian{{ $camel }}QuarantineBacklog
---
apiVersion: monitoring.benjamin-borbe.de/v1
kind: Alert
metadata:
  name: '{{ $name }}-bulk-ref-delete-warning'
  namespace: {{ $.Release.Namespace }}
spec:
  annotations:
    summary: {{ $name }} git-rest is deleting claim refs in bulk
    description: 'git-rest in {{ $name }} has deleted more than 100 claim refs in 5min — normal traffic peaks near 80 per 5min. A mass deletion clears redrive streak or job-claim state without a per-task audit trail, so check which executor is calling /api/v1/refs and why.'
  expression: |-
    sum by (kubernetes_pod_name) (increase(git_rest_ref_requests_total{app="{{ $name }}",op="delete",result="200"}[5m])) > 100
  for: 2m
  labels:
    severity: warning
    namespace: {{ $.Release.Namespace }}
  name: VaultObsidian{{ $camel }}BulkRefDelete
{{- end }}
{{- end }}

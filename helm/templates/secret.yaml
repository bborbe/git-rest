{{- range $vault := .Values.vaults }}
{{- if and (not $vault.existingSecret) $vault.secret }}
{{- $name := include "git-rest.vaultName" (dict "name" $vault.name) }}
---
# Created only when the vault provides inline `secret:` values AND no
# existingSecret is referenced (generic clusters without teamvault). quant sets
# existingSecret, so nothing is created here.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "git-rest.labels" $ | nindent 4 }}
data:
  ssh-key: {{ required (printf "vaults[%s].secret.sshKey is required when creating a Secret" $vault.name) $vault.secret.sshKey | b64enc | quote }}
  gateway-secret: {{ required (printf "vaults[%s].secret.gatewaySecret is required when creating a Secret" $vault.name) $vault.secret.gatewaySecret | b64enc | quote }}
  {{- with $vault.secret.sentryDsn }}
  sentry-dsn: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
